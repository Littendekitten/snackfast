<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnackFast | Snelle Bezorging</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Screen -->
  <div class="auth-overlay hidden" id="login-screen">
    <div class="auth-card">
      <h2>SnackFast</h2>
      <p>Log in met Google om verder te gaan</p>
      <button class="btn google-btn" id="google-login-btn">Inloggen met Google</button>
    </div>
  </div>

  <!-- Onboarding Screen -->
  <div class="auth-overlay hidden" id="onboarding-screen">
    <div class="auth-card">
      <h2>Welkom!</h2>
      <div class="form-group">
        <label>Kies je taal:</label>
        <select id="language-select">
          <option value="nl">Nederlands</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="form-group">
        <label>Gebruikersnaam (max 12):</label>
        <input type="text" id="username-input" maxlength="12" placeholder="Jouw naam" />
      </div>
      <button class="btn btn-primary" id="save-profile-btn">Aan de slag</button>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app-container" class="hidden">
    <header>
      <div class="nav-container">
        <a href="/" class="logo">Snack<span>Fast</span></a>
        <div class="nav-actions">
          <a href="/jobs" class="btn btn-primary" id="nav-jobs-btn" style="text-decoration:none; padding:0.4rem 0.8rem; font-size:0.9rem;">Werken bij ons?</a>
          <span id="display-username" style="font-weight:bold; margin-left:10px;"></span>
          <button class="btn btn-outline" style="padding:0.4rem; border:none; font-size:1.2rem; cursor:pointer;" id="open-settings-btn">⚙️</button>
          <button class="btn btn-outline" style="padding:0.4rem; font-size:0.8rem;" id="logout-btn">Uitloggen</button>
        </div>
      </div>
    </header>

    <div class="container">
      <section class="hero">
        <h1 id="txt-hero-title">Snelle Bezorging</h1>
        <p>Selecteer een snack om direct via Tikkie te bestellen!</p>
      </section>

      <h2 class="section-title">Onze Producten</h2>
      <div class="grid" id="product-grid">Laden...</div>

      <h2 class="section-title">Onze Locaties</h2>
      <div class="grid" id="locations-grid">Laden...</div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal-overlay" id="checkout-modal">
    <div class="modal-content">
      <h3 id="modal-item-name">Overzicht</h3>
      <p>Prijs: <span id="modal-item-price"></span> (+ €1,00 verzendkosten)</p>
      <h3 style="margin-top:10px;">Totaal: <span id="modal-total-price"></span></h3>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-outline" id="modal-cancel">Annuleren</button>
        <button class="btn btn-tikkie" id="modal-confirm">Betaal via Tikkie</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Instellingen</h3>
      
      <div class="form-group">
        <label>Thema:</label>
        <select id="theme-select">
          <option value="default">Standaard</option>
          <option value="dark">Dark Mode</option>
          <option value="kitacat">KitaCat Special</option>
        </select>
      </div>

      <div class="form-group">
        <label>Taal / Language:</label>
        <select id="settings-language-select">
          <option value="nl">Nederlands</option>
          <option value="en">English</option>
        </select>
      </div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-outline" id="close-settings-btn">Sluiten</button>
        <button class="btn btn-primary" id="save-settings-btn">Opslaan</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
